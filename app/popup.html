<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Subs to Tabs</title>
    <link rel="stylesheet" href="styles/popup.css">
  </head>
  <body>
    <main>
      <h1>YouTube Subs to Tabs</h1>
      <button id="open-feed" type="button">Open channel feed</button>
      <p id="hint">Use this on the YouTube channel feed.</p>
      <button id="open-channels" type="button">Open channel tabs</button>
      <label>
        <input id="open-videos" type="checkbox">
        Open channel videos pages
      </label>
      <label>
        <input id="debug" type="checkbox">
        Enable debug logging
      </label>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="scripts/debug.js"></script>
    <script src="scripts/popup.js"></script>
  </body>
</html>
